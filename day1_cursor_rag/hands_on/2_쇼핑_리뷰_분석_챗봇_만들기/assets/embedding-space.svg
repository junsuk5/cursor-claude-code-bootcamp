<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <title>임베딩 의미 공간</title>
  <desc>의미가 비슷한 리뷰는 좌표 공간에서 가까이 모이고, 질문 좌표 주변의 리뷰가 검색된다</desc>
  <rect x="0" y="0" width="1200" height="520" fill="#f8fafc"/>
  <ellipse cx="315" cy="272" rx="250" ry="176" fill="#ecfdf5" stroke="#86efac" stroke-width="4"/>
  <ellipse cx="905" cy="272" rx="195" ry="156" fill="#eff6ff" stroke="#93c5fd" stroke-width="4"/>
  <text x="315" y="144" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#0f766e">운동 · 고정력 이야기</text>
  <text x="905" y="164" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#1e40af">음질 이야기</text>
  <text x="600" y="99" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="20" font-weight="700" fill="#0f172a">질문 근처의 리뷰만 검색된다</text>
  <circle cx="300" cy="200" r="8" fill="#64748b"/>
  <text x="300" y="232" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="18" fill="#334155">r051 러닝머신</text>
  <circle cx="185" cy="290" r="8" fill="#64748b"/>
  <text x="185" y="322" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="18" fill="#334155">r031 웨이트</text>
  <circle cx="445" cy="300" r="8" fill="#64748b"/>
  <text x="445" y="332" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="18" fill="#334155">r076 조깅</text>
  <circle cx="852" cy="220" r="8" fill="#64748b"/>
  <text x="852" y="252" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="18" fill="#334155">r025 저음</text>
  <circle cx="955" cy="285" r="8" fill="#64748b"/>
  <text x="955" y="317" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="18" fill="#334155">r045 해상력</text>
  <circle cx="860" cy="340" r="8" fill="#64748b"/>
  <text x="860" y="372" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="18" fill="#334155">r052 고음</text>
  <circle cx="315" cy="290" r="14" fill="#b45309"/>
  <text x="315" y="329" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="20" font-weight="700" fill="#b45309">질문 좌표</text>
</svg>
